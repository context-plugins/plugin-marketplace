name: Check plugin versions

# A commit or PR touching a plugin is supposed to bump `version` in all three of its manifests
# (plugin.json, .claude-plugin/plugin.json, .cursor-plugin/plugin.json — see CLAUDE.md's "Per-IDE
# manifest convention"). This fails the run instead of fixing anything up: it compares each changed
# plugin's version against what it declared before the change and requires a genuine semver
# increase (e.g. 0.1.0 -> 0.1.1 or 0.1.0 -> 1.2.3 pass; 0.1.3 -> 0.1.0 or 0.1.3 -> 0.1.3 fail), and
# requires all three manifests to agree on the new version.
#
# Scoped to plugins/** so it only fires on plugin content, not workflow/doc changes, and skipped
# entirely when a commit in the range is a backfill (see the skip step below).
on:
  pull_request:
    branches: [main]
    paths:
      - 'plugins/**'
  push:
    branches: [main]
    paths:
      - 'plugins/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          fetch-depth: 0

      - name: Determine base commit
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"

      # The `Sync marketplace registries and docs` workflow writes generated description text into
      # plugins/** and commits it as apimatic-bot ("Backfill description for ..."), straight to main
      # with no PR. That is a bot content fill, not a plugin change anyone chose to make, so there
      # is no author to bump a version and nobody to fix the red X it would leave on main. If any
      # commit in the range says "Backfill" (case-insensitive), the check below is skipped.
      - name: Skip runs that carry a backfill commit
        run: |
          set -uo pipefail
          # BASE_SHA is empty on the first workflow_dispatch of a branch and all-zeros on a
          # branch-creation push; in both cases there is no range, so look at HEAD alone.
          if [ -n "${BASE_SHA:-}" ] && git rev-parse --verify --quiet "${BASE_SHA}^{commit}" >/dev/null; then
            messages="$(git log --format=%B "${BASE_SHA}..HEAD")"
          else
            messages="$(git log -1 --format=%B HEAD)"
          fi
          if printf '%s' "$messages" | grep -qi 'backfill'; then
            echo "SKIP_VERSION_CHECK=true" >> "$GITHUB_ENV"
            echo "Backfill commit in this range — skipping the plugin version check."
          fi

      - name: Check plugin versions
        if: env.SKIP_VERSION_CHECK != 'true'
        run: python3 .github/scripts/check_plugin_versions.py
